packages:
  - apps/*
  - packages/*

allowBuilds:
  electron-winstaller: false

# electron-builder 26.18.0 still asks for minimatch 9 and 10, open to a
# denial of service (GHSA-g3hv-75wg-m249). Drop this once it asks for 11.
overrides:
  "minimatch@>=7.0.0 <11.0.1": ^11.0.1

catalog:
  # Tooling
  oxfmt: 0.75.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  turbo: 2.11.10
  typescript: 7.0.2
  vitest: 5.0.5
  # A DOM for component tests (already here, through wxt).
  linkedom: 0.18.15
  wxt: 0.21.5
  "@types/node": 24.19.2

  # Schemas and API
  zod: 4.6.7
  "@orpc/client": 1.16.1
  "@orpc/contract": 1.16.1
  "@orpc/server": 1.16.1
  "@orpc/tanstack-query": 1.16.1
  "@modelcontextprotocol/server": 2.4.0

  # Backend logic and data
  effect: 4.1.1
  "@effect/platform-node": 4.1.1
  "@effect/vitest": 4.1.1
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5

  # Desktop shell
  electron: 45.2.1
  electron-vite: 6.0.0
  electron-builder: 26.18.0
  "@electron/fuses": 2.1.3

  # Renderer
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  vite: 8.3.5
  "@vitejs/plugin-react": 6.1.2
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  "@base-ui/react": 1.9.0
  motion: 14.9.0
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  "@tanstack/react-router": 1.170.46
  "@tanstack/router-plugin": 1.168.48
  "@tanstack/react-query": 5.105.0
  "@tanstack/react-hotkeys": 0.20.0
  "@inlang/paraglide-js": 2.29.3

  # Config files of other apps (Settings ▸ Agents)
  smol-toml: 1.9.1
