name: Bug
description: Something does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never paste real transcripts, recordings, names of people you recorded, or logs that contain them. Describe what happened, or reproduce it on invented data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Sondine version
      description: The release you installed; Settings ▸ General also shows it, with the updates.
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS
      description: For example « MacBook Air M5, 32 GB, macOS 27.2 ».
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots on invented data, the audio devices involved, the app in front.
